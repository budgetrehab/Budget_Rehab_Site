  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;min-height:100vh;color:#fff;overflow-x:hidden;position:relative;
    background:linear-gradient(160deg,var(--b1),var(--b2));
    display:flex;align-items:center;justify-content:center;text-align:center;
    padding:env(safe-area-inset-top,0) 24px env(safe-area-inset-bottom,0);
    font-family:"Questrial","Century Gothic","Avenir Next",sans-serif;
  }

  /* drifting aurora glows */
  .aurora{position:fixed;inset:-20%;pointer-events:none;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
  .blob{position:absolute;border-radius:50%;filter:blur(80px);mix-blend-mode:soft-light;opacity:.6}
  .b1{width:52vmax;height:52vmax;background:var(--soft);top:5%;left:0%;animation:drift1 40s ease-in-out infinite alternate}
  .b2{width:46vmax;height:46vmax;background:var(--deep);bottom:0;right:2%;animation:drift2 46s ease-in-out infinite alternate}
  .b3{width:30vmax;height:30vmax;background:var(--rose);top:40%;left:45%;opacity:.55;animation:drift3 30s ease-in-out infinite alternate}
  .b4{width:26vmax;height:26vmax;background:var(--mint);top:10%;right:15%;opacity:.4;animation:drift1 34s ease-in-out infinite alternate-reverse}
  @keyframes drift1{to{transform:translate(18vw,12vh) scale(1.15)}}
  @keyframes drift2{to{transform:translate(-16vw,-14vh) scale(1.1)}}
  @keyframes drift3{to{transform:translate(-20vw,10vh) scale(.85)}}

  canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}

  /* soft vignette for depth */
  .vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(40,15,90,.18) 100%)}

  main{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%}

  /* logo */
  .logo{
    width:min(86vw,880px);aspect-ratio:1728/190;position:relative;
    animation:enter 1.4s cubic-bezier(.2,.8,.2,1) both, float 7s 1.4s ease-in-out infinite;
    filter:drop-shadow(0 6px 24px rgba(50,15,110,.28));
  }
  .logo i{
    position:absolute;inset:0;
    -webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;
    background:#fff;
  }
  @keyframes shine{0%{background-position:100% 0}45%,100%{background-position:0% 0}}
  @keyframes enter{from{opacity:0;transform:translateY(24px) scale(.96);filter:blur(10px) drop-shadow(0 6px 24px rgba(50,15,110,0))}to{opacity:1;transform:none}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

  /* fine divider */
  .line{
    width:min(40vw,220px);height:1px;margin:clamp(26px,4.5vw,40px) 0 clamp(20px,3.5vw,30px);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);
    transform:scaleX(0);animation:grow 1.2s 1s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes grow{to{transform:scaleX(1)}}

  .soon{
    margin:0;font-size:clamp(15px,3.2vw,24px);text-transform:uppercase;white-space:nowrap;
    letter-spacing:.42em;padding-left:.42em;
    animation:soonIn 1.6s 1.2s cubic-bezier(.2,.8,.2,1) both;
  }
  .shimmer{
    background:linear-gradient(105deg,#fff 0%,#fff 38%,var(--rose) 44%,#fff 48%,var(--mint) 52%,#fff 58%,#fff 100%);
    background-size:300% 100%;background-position:100% 0;
    -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
    animation:shine 5s 2.6s ease-in-out infinite;
  }
  @keyframes shine{0%{background-position:100% 0}45%,100%{background-position:0% 0}}
  @keyframes soonIn{from{opacity:0;letter-spacing:.9em;filter:blur(8px)}to{opacity:1;letter-spacing:.42em;filter:blur(0)}}
  .dot{display:inline-block;animation:pulse 1.6s ease-in-out infinite}
  .dot:nth-child(3){animation-delay:.2s}.dot:nth-child(4){animation-delay:.4s}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

  /* early access */
  .signup{width:min(92vw,460px);display:flex;flex-direction:column;align-items:center;margin-top:clamp(72px,12vw,110px);animation:rise 1s 2s cubic-bezier(.2,.8,.2,1) both}
  .signup .lead{margin:0 0 14px;text-wrap:balance;white-space:nowrap;font-size:15px;letter-spacing:.04em;color:rgba(255,255,255,.88)}
  .field{
    display:flex;gap:6px;padding:6px;border-radius:999px;
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 10px 30px rgba(50,15,110,.18);transition:border-color .25s,background .25s;
  }
  .field:focus-within{border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.2)}
  .field input{
    flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;
    font:16px "Questrial",sans-serif;padding:0 14px;letter-spacing:.02em;
  }
  .field input::placeholder{color:rgba(255,255,255,.7)}
  .field button{
    border:0;cursor:pointer;border-radius:999px;padding:13px 20px;white-space:nowrap;
    background:#fff;color:#5A3DB0;font:600 14px "Questrial",sans-serif;letter-spacing:.08em;text-transform:uppercase;
    transition:transform .2s,box-shadow .2s;
  }
  .field button:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(255,255,255,.35)}
  .field button:disabled{opacity:.7;cursor:default;transform:none}
  .note{min-height:22px;margin:12px 0 0;font-size:14px;color:rgba(255,255,255,.85)}
  .note.err{color:#FFE0E6}
  /* confirmation */
  body.joined .soon,body.joined .line{opacity:0;max-height:0;margin:0;overflow:hidden;transition:opacity .5s,max-height .7s,margin .7s}
  .soon,.line{max-height:80px}
  body.joined .signup{margin-top:clamp(52px,8vw,84px);transition:margin .7s cubic-bezier(.2,.8,.2,1)}
  .done{
    position:relative;width:100%;padding:clamp(28px,5vw,40px) clamp(22px,5vw,40px) clamp(26px,4.5vw,34px);
    border-radius:30px;text-align:center;
    background:linear-gradient(150deg,rgba(255,255,255,.26),rgba(255,255,255,.08));
    backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
    box-shadow:0 24px 60px rgba(45,15,105,.35),inset 0 1px 0 rgba(255,255,255,.45);
    animation:pop .9s cubic-bezier(.2,1.2,.3,1) both;
  }
  .done::before{
    content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
    background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,194,206,.5) 35%,rgba(184,245,210,.5) 65%,rgba(255,255,255,.2));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  }
  @keyframes pop{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
  .badge{
    width:64px;height:64px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;
    background:#fff;box-shadow:0 0 0 8px rgba(255,255,255,.14),0 10px 30px rgba(255,255,255,.35);
    animation:pop .8s .15s cubic-bezier(.2,1.4,.3,1) both;
  }
  .badge svg{width:30px;height:30px}
  .badge path{fill:none;stroke:#7B57D1;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .6s .6s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .done .kicker{display:block;font-size:12px;letter-spacing:.38em;text-transform:uppercase;color:rgba(255,255,255,.75);margin-bottom:12px;padding-left:.38em}
  .done h2{
    margin:0;font-weight:400;font-size:clamp(22px,4.6vw,30px);line-height:1.25;letter-spacing:.02em;text-wrap:balance;
  }
  .done .rule{display:none;width:48px;height:1px;margin:18px auto;background:linear-gradient(90deg,transparent,#fff,transparent)}
  .done p.sub{margin:12px 0 0;font-size:15px;line-height:1.5;color:rgba(255,255,255,.85);text-wrap:balance}
  .done .pv{display:block;margin-top:16px;font-size:12px;color:rgba(255,255,255,.6)}
  .burst{position:absolute;left:50%;top:clamp(60px,9vw,72px);width:0;height:0;pointer-events:none}
  .burst i{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;opacity:0;
    animation:fly 1.1s .35s cubic-bezier(.1,.8,.3,1) forwards}
  @keyframes fly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.3)}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .hp{position:absolute;left:-9999px}
  .signup form{width:100%}
  @media (max-width:360px){.signup .lead{font-size:13px}}
  @media (max-width:420px){
    .field{flex-direction:column;border-radius:24px;padding:8px}
    .field input{padding:12px 14px;text-align:center}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .line{transform:none}
  }
</style>
</head>
<body>
  <div class="aurora" id="aurora">
    <div class="blob b1"></div><div class="blob b2"></div>
  </div>
  <canvas id="sparkles"></canvas>
  <div class="vignette"></div>

  <main>
    <h1 class="logo" aria-label="Budget Rehab" style="margin:0"><i></i></h1>
    <div class="line"></div>
    <p class="soon"><span class="shimmer">Coming soon</span><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></p>

    <div class="signup" id="signup">
      <p class="lead">Heal your relationship with money.</p>
      <form id="form" method="POST" action="https://formsubmit.co/admin@budgetrehab.co.uk" novalidate>
        <input type="hidden" name="_subject" value="New Budget Rehab early access sign-up">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_autoresponse" value="Thank you for signing up for early access to Budget Rehab! Your journey to healing your relationship with money begins soon. We'll email you the moment the app launches. With love, The Budget Rehab team">
        <input type="hidden" name="_next" id="next" value="">
        <p class="hp"><label>Leave this empty <input name="_honey" tabindex="-1" autocomplete="off"></label></p>
        <div class="field">
          <input type="email" name="email" id="email" placeholder="Your email address" autocomplete="email" required aria-label="Email address">
          <button type="button" id="btn">Get early access</button>
        </div>
        <p class="note" id="note" role="status"></p>
      </form>
    </div>
  </main>

<script>
  // ── Early access sign-up ──
  // Sign-ups go to the address in the form's action (via FormSubmit.co – free, no account),
  // and the person signing up gets the _autoresponse message as a confirmation email.
  // The very first sign-up sends an activation email to admin@budgetrehab.co.uk: click the link once.

  (function(){
    const form=document.getElementById('form'),email=document.getElementById('email'),
          btn=document.getElementById('btn'),note=document.getElementById('note'),box=document.getElementById('signup');
    // Real sign-ups only send from your own site (budgetrehab.co.uk or a netlify.app address)
    const preview=!/budgetrehab|netlify\.app/i.test(location.hostname);
    function msg(t,err){note.textContent=t;note.className='note'+(err?' err':'');}
    function confirmed(extra){
      let dots='';const cols=['#fff','#FFC2CE','#B8F5D2','#E4D8FF'];
      for(let i=0;i<14;i++){const a=i/14*Math.PI*2,d=70+Math.random()*50;
        dots+='<i style="--x:'+(Math.cos(a)*d).toFixed(0)+'px;--y:'+(Math.sin(a)*d).toFixed(0)+'px;background:'+cols[i%4]+'"></i>';}
      document.body.classList.add('joined');
      box.innerHTML='<div class="done" role="status">'+
        '<div class="burst">'+dots+'</div>'+
        '<div class="badge"><svg viewBox="0 0 30 30"><path d="M8 15.5l5 5 9-11"/></svg></div>'+
        '<h2 class="shimmer">Your Budget Rehab journey begins soon</h2>'+
        '<p class="sub">Keep an eye on your inbox.</p>'+
        (extra||'')+'</div>';
    }

    function submit(e){
      if(e)e.preventDefault();
      if(btn.disabled)return;
      const v=email.value.trim();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)){msg('Please enter a valid email address.',true);email.focus();return;}
      if(form.querySelector('[name=_honey]').value)return;
      if(preview){confirmed('<small class="pv">Preview only: no email sent.</small>');return;}
      btn.disabled=true;btn.textContent='Joining\u2026';msg('');
      // after FormSubmit's quick "I'm not a robot" check it sends them back here to the confirmation
      document.getElementById('next').value=location.origin+location.pathname+'#joined';
      form.submit();
    }
    if(location.hash==='#joined'){
      confirmed();
      try{history.replaceState(null,'',location.pathname);}catch(_){}
    }
    btn.addEventListener('click',submit);
    email.addEventListener('keydown',e=>{if(e.key==='Enter')submit(e);});
    form.addEventListener('submit',submit);
  })();

  // gentle parallax on the glows
  (function(){
    const a=document.getElementById('aurora');
    function move(x,y){a.style.transform='translate('+(x*-30)+'px,'+(y*-30)+'px)';}
    addEventListener('pointermove',e=>move(e.clientX/innerWidth-.5,e.clientY/innerHeight-.5));
  })();

  // twinkling, rising sparkles
  (function(){
    if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    const c=document.getElementById('sparkles'),ctx=c.getContext('2d');
    let W,H,dpr,parts=[];
    function size(){dpr=Math.min(devicePixelRatio||1,2);W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;}
    size();addEventListener('resize',size);
    const N=Math.round(Math.min(22,innerWidth/50));
    const tints=['255,255,255'];
    function make(initial){
      return{x:Math.random()*W,y:initial?Math.random()*H:H+20*dpr,
        r:(Math.random()*1.2+0.5)*dpr,vy:(Math.random()*0.12+0.05)*dpr,
        sway:Math.random()*Math.PI*2,swaySpeed:Math.random()*0.01+0.004,
        tw:Math.random()*Math.PI*2,twSpeed:Math.random()*0.015+0.006,
        star:Math.random()<0.15,tint:tints[(Math.random()*tints.length)|0]};
    }
    for(let i=0;i<N;i++)parts.push(make(true));
    function drawStar(x,y,r,a,t){
      ctx.fillStyle='rgba('+t+','+a+')';ctx.beginPath();
      const R=r*3.2;ctx.moveTo(x,y-R);ctx.quadraticCurveTo(x,y,x+R,y);ctx.quadraticCurveTo(x,y,x,y+R);
      ctx.quadraticCurveTo(x,y,x-R,y);ctx.quadraticCurveTo(x,y,x,y-R);ctx.fill();
    }
    function tick(){
      ctx.clearRect(0,0,W,H);
      for(const p of parts){
        p.y-=p.vy;p.sway+=p.swaySpeed;p.tw+=p.twSpeed;
        const x=p.x+Math.sin(p.sway)*12*dpr;
        const a=0.12+0.4*(0.5+0.5*Math.sin(p.tw));
        if(p.star){drawStar(x,p.y,p.r,a,p.tint);}
        else{
          const g=ctx.createRadialGradient(x,p.y,0,x,p.y,p.r*3);
          g.addColorStop(0,'rgba('+p.tint+','+a+')');g.addColorStop(1,'rgba('+p.tint+',0)');
          ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,p.y,p.r*3,0,Math.PI*2);ctx.fill();
        }
        if(p.y<-30*dpr)Object.assign(p,make(false));
      }
      requestAnimationFrame(tick);
    }
    tick();
  })();
</script>
</body>
</html>
