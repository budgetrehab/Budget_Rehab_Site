<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B094EC">
<title>Budget Rehab – Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">
<style>
  :root{
    --b1:#B094EC;--b2:#8B68DA;--deep:#5A3DB0;--soft:#C9B4FF;--mint:#B8F5D2;--rose:#FFC2CE;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;min-height:100vh;color:#fff;overflow-x:hidden;position:relative;
    background:linear-gradient(160deg,var(--b1),var(--b2));
    display:flex;align-items:center;justify-content:center;text-align:center;
    padding:env(safe-area-inset-top,0) 24px env(safe-area-inset-bottom,0);
    font-family:"Questrial","Century Gothic","Avenir Next",sans-serif;
  }

  /* drifting aurora glows */
  .aurora{position:fixed;inset:-20%;pointer-events:none;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
  .blob{position:absolute;border-radius:50%;filter:blur(80px);mix-blend-mode:soft-light;opacity:.6}
  .b1{width:52vmax;height:52vmax;background:var(--soft);top:5%;left:0%;animation:drift1 40s ease-in-out infinite alternate}
  .b2{width:46vmax;height:46vmax;background:var(--deep);bottom:0;right:2%;animation:drift2 46s ease-in-out infinite alternate}
  .b3{width:30vmax;height:30vmax;background:var(--rose);top:40%;left:45%;opacity:.55;animation:drift3 30s ease-in-out infinite alternate}
  .b4{width:26vmax;height:26vmax;background:var(--mint);top:10%;right:15%;opacity:.4;animation:drift1 34s ease-in-out infinite alternate-reverse}
  @keyframes drift1{to{transform:translate(18vw,12vh) scale(1.15)}}
  @keyframes drift2{to{transform:translate(-16vw,-14vh) scale(1.1)}}
  @keyframes drift3{to{transform:translate(-20vw,10vh) scale(.85)}}

  canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}

  /* soft vignette for depth */
  .vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(40,15,90,.18) 100%)}

  main{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%;padding:clamp(80px,22vh,240px) 0 40px}

  /* logo: plain image, no filters or scaling, so Safari keeps it sharp */
  .logo{
    margin:0;width:min(86vw,880px);line-height:0;
    animation:enter 1.2s ease-out both;
  }
  .logo img{display:block;width:100%;height:auto;-webkit-user-drag:none;user-select:none}
  @keyframes enter{from{opacity:0}to{opacity:1}}

  /* fine divider */
  .line{
    width:min(40vw,220px);height:1px;margin:clamp(26px,4.5vw,40px) 0 clamp(20px,3.5vw,30px);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);
    transform:scaleX(0);animation:grow 1.2s 1s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes grow{to{transform:scaleX(1)}}

  .soon{
    margin:0;font-size:clamp(15px,3.2vw,24px);text-transform:uppercase;white-space:nowrap;
    letter-spacing:.42em;padding-left:.42em;
  }
  /* typewriter */
  .tw{display:inline-grid;text-align:left}
  .tw>*{grid-area:1/1}
  .tw .sizer{visibility:hidden}
  .caret{display:inline-block;width:2px;height:1.05em;margin-left:.08em;vertical-align:-.12em;background:#fff;
    border-radius:1px;animation:caret 1s steps(1) infinite;transition:opacity .4s}
  .tw.finished .caret{animation:none;opacity:0}
  @keyframes caret{50%{opacity:0}}

  /* early access */
  .signup{width:min(92vw,460px);display:flex;flex-direction:column;align-items:center;margin-top:clamp(72px,12vw,110px);animation:rise 1s 2s cubic-bezier(.2,.8,.2,1) both}
  .signup .lead{margin:0 0 18px;text-wrap:balance;white-space:nowrap;font-size:15px;letter-spacing:.04em;color:rgba(255,255,255,.88)}
  .fields{display:flex;flex-direction:column}
  .fields .row{display:grid;grid-template-columns:auto 1fr;align-items:end;column-gap:20px;row-gap:4px;text-align:left}
  .f{display:contents;cursor:text}
  .lbl{display:flex;align-items:center;gap:10px;white-space:nowrap;padding:0 0 11px;
    font-size:15px;letter-spacing:.04em;color:rgba(255,255,255,.9)}
  .emo{font-size:18px;line-height:1;width:1.3em;text-align:center}
  @media (max-width:380px){.lbl{font-size:14px;gap:7px}.fields .row{column-gap:12px}}
  .fields input{
    width:100%;min-width:0;padding:14px 4px 10px;outline:0;color:#fff;
    background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.45);border-radius:0;
    font:17px "Questrial",sans-serif;letter-spacing:.03em;text-align:left;
    transition:border-color .25s;
  }
  .fields input:focus{border-bottom-color:#fff}
  .fields input::placeholder{color:rgba(255,255,255,.7);transition:opacity .2s}
  .fields input:focus::placeholder{opacity:.45}
  .fields input.bad{border-bottom-color:#FFC2CE}
  /* stop the browser's autofill highlight */
  .fields input:-webkit-autofill,.fields input:-webkit-autofill:hover,.fields input:-webkit-autofill:focus,.fields input:-webkit-autofill:active,.fields input:autofill{
    -webkit-text-fill-color:#fff;caret-color:#fff;
    -webkit-box-shadow:0 0 0 1000px transparent inset;box-shadow:0 0 0 1000px transparent inset;
    background-color:transparent!important;background-clip:text;
    transition:background-color 99999s ease-in-out 0s,color 99999s ease-in-out 0s;
  }
  .fields button{
    margin-top:26px;border:0;cursor:pointer;border-radius:999px;padding:16px 20px;white-space:nowrap;
    background:#fff;color:#5A3DB0;font:600 14px "Questrial",sans-serif;letter-spacing:.1em;text-transform:uppercase;
    box-shadow:0 10px 30px rgba(50,15,110,.2);transition:transform .2s,box-shadow .2s;
  }
  .fields button:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(255,255,255,.35)}
  .fields button:disabled{opacity:.7;cursor:default;transform:none}
  .note{min-height:22px;margin:12px 0 0;font-size:14px;color:rgba(255,255,255,.85)}
  .note.err{color:#FFE0E6}
  /* confirmation */
  body.joined .soon,body.joined .line{opacity:0;max-height:0;margin:0;overflow:hidden;transition:opacity .5s,max-height .7s,margin .7s}
  .soon,.line{max-height:80px}
  body.joined .signup{margin-top:clamp(52px,8vw,84px);transition:margin .7s cubic-bezier(.2,.8,.2,1)}
  .done{
    position:relative;width:100%;padding:clamp(28px,5vw,40px) clamp(22px,5vw,40px) clamp(26px,4.5vw,34px);
    border-radius:30px;text-align:center;
    background:linear-gradient(150deg,rgba(255,255,255,.26),rgba(255,255,255,.08));
    backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
    box-shadow:0 24px 60px rgba(45,15,105,.35),inset 0 1px 0 rgba(255,255,255,.45);
    animation:pop .9s cubic-bezier(.2,1.2,.3,1) both;
  }
  .done::before{
    content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
    background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,194,206,.5) 35%,rgba(184,245,210,.5) 65%,rgba(255,255,255,.2));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  }
  @keyframes pop{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
  .badge{
    width:64px;height:64px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;
    background:#fff;box-shadow:0 0 0 8px rgba(255,255,255,.14),0 10px 30px rgba(255,255,255,.35);
    animation:pop .8s .15s cubic-bezier(.2,1.4,.3,1) both;
  }
  .badge svg{width:30px;height:30px}
  .badge path{fill:none;stroke:#7B57D1;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .6s .6s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .done .kicker{display:block;font-size:12px;letter-spacing:.38em;text-transform:uppercase;color:rgba(255,255,255,.75);margin-bottom:12px;padding-left:.38em}
  .done h2{
    margin:0;font-weight:400;font-size:clamp(21px,5.4vw,26px);line-height:1.25;letter-spacing:.02em;text-wrap:balance;
  }
  .done .rule{display:none;width:48px;height:1px;margin:18px auto;background:linear-gradient(90deg,transparent,#fff,transparent)}
  .done p.sub{margin:10px 0 0;font-size:15px;letter-spacing:.03em;line-height:1.5;color:rgba(255,255,255,.85);text-wrap:balance}
  .done .pv{display:block;margin-top:16px;font-size:12px;color:rgba(255,255,255,.6)}
  .burst{position:absolute;left:50%;top:clamp(60px,9vw,72px);width:0;height:0;pointer-events:none}
  .burst i{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;opacity:0;
    animation:fly 1.1s .35s cubic-bezier(.1,.8,.3,1) forwards}
  @keyframes fly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.3)}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .hp{position:absolute;left:-9999px}
  .signup form{width:100%}
  @media (max-width:360px){.signup .lead{font-size:13px}}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .line{transform:none}
  }
</style>
</head>
<body>
  <div class="aurora" id="aurora">
    <div class="blob b1"></div><div class="blob b2"></div>
  </div>
  <canvas id="sparkles"></canvas>
  <div class="vignette"></div>

  <main>
    <h1 class="logo"><img src="logo.png" alt="Budget Rehab" width="1728" height="190"></h1>
    <div class="line"></div>
    <p class="soon" aria-label="App coming soon"><span class="tw" aria-hidden="true"><span class="sizer">App coming soon...<i class="caret"></i></span><span><span id="typed"></span><i class="caret"></i></span></span></p>

    <div class="signup" id="signup">
      <p class="lead">Heal your relationship with money.</p>
      <form id="form" novalidate>
        <p class="hp"><label>Leave this empty <input name="website" tabindex="-1" autocomplete="off"></label></p>
        <div class="fields"><div class="row">
            <label class="f"><span class="lbl"><span class="emo" aria-hidden="true">👤</span>Name</span>
              <input type="text" name="name" id="name" autocomplete="name" required maxlength="100"></label>
            <label class="f"><span class="lbl"><span class="emo" aria-hidden="true">✉️</span>Email Address</span>
              <input type="email" name="email" id="email" autocomplete="email" required></label>
            <label class="f"><span class="lbl"><span class="emo" aria-hidden="true">📱</span>Phone Number</span>
              <input type="tel" name="phone" id="phone" autocomplete="tel" required maxlength="30"></label>
          </div>
          <button type="button" id="btn">Get early access</button>
        </div>
        <p class="note" id="note" role="status"></p>
      </form>
    </div>
  </main>

<script>
  // ── Early access sign-up ──
  // Sign-ups are saved to your Google Sheet by the Google Apps Script web app below.
  // Paste your web app URL between the quotes (it ends in /exec).
  const SIGNUP_URL = "https://script.google.com/macros/s/AKfycbzO1BkZuDvBz48KJdsTnx0hR0NwQLgqIoB5cCQiUTeBJ6ALKYGjZuxP4npmJQNajmc96w/exec";

  (function(){
    const form=document.getElementById('form'),email=document.getElementById('email'),
          btn=document.getElementById('btn'),note=document.getElementById('note'),box=document.getElementById('signup');
    // Real sign-ups only send from your own site (budgetrehab.co.uk, github.io, gitlab.io or netlify.app)
    const preview=!/budgetrehab|netlify\.app|github\.io|gitlab\.io/i.test(location.hostname);
    function msg(t,err){note.textContent=t;note.className='note'+(err?' err':'');}
    function confirmed(extra){
      let dots='';const cols=['#fff','#FFC2CE','#B8F5D2','#E4D8FF'];
      for(let i=0;i<14;i++){const a=i/14*Math.PI*2,d=70+Math.random()*50;
        dots+='<i style="--x:'+(Math.cos(a)*d).toFixed(0)+'px;--y:'+(Math.sin(a)*d).toFixed(0)+'px;background:'+cols[i%4]+'"></i>';}
      document.body.classList.add('joined');
      box.innerHTML='<div class="done" role="status">'+
        '<div class="burst">'+dots+'</div>'+
        '<div class="badge"><svg viewBox="0 0 30 30"><path d="M8 15.5l5 5 9-11"/></svg></div>'+
        '<h2>Thank you for signing up</h2>'+
        '<p class="sub">Your Budget Rehab journey begins soon</p>'+
        (extra||'')+'</div>';
    }

    const nameEl=document.getElementById('name'),phoneEl=document.getElementById('phone');
    function bad(el,text){el.classList.add('bad');msg(text,true);el.focus();}
    [nameEl,email,phoneEl].forEach(el=>el.addEventListener('input',()=>{el.classList.remove('bad');msg('');}));

    async function submit(e){
      if(e)e.preventDefault();
      if(btn.disabled)return;
      const n=nameEl.value.trim(),v=email.value.trim(),ph=phoneEl.value.trim();
      if(!n)return bad(nameEl,'Please enter your name.');
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v))return bad(email,'Please enter a valid email address.');
      if((ph.match(/\d/g)||[]).length<7||/[^\d\s()+\-.]/.test(ph))return bad(phoneEl,'Please enter a valid phone number.');
      if(form.querySelector('[name=website]').value)return;
      if(preview){confirmed('<small class="pv">Preview only: nothing sent.</small>');return;}
      btn.disabled=true;btn.textContent='Joining\u2026';msg('');
      try{
        const res=await fetch(SIGNUP_URL,{method:'POST',body:new URLSearchParams({name:n,email:v,phone:ph})});
        const data=await res.json();
        if(!data.ok)throw new Error(data.error||'failed');
        confirmed();
      }catch(err){
        btn.disabled=false;btn.textContent='Get early access';
        msg('Sorry, something went wrong. Please try again.',true);
      }
    }
    btn.addEventListener('click',submit);
    [nameEl,email,phoneEl].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')submit(e);}));
    form.addEventListener('submit',submit);
  })();

  // typewriter "App coming soon..."
  (function(){
    const el=document.getElementById('typed'),text='App coming soon...';
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=text;el.closest('.tw').classList.add('finished');return;}
    let i=0;
    function type(){
      el.textContent=text.slice(0,++i);
      if(i<text.length){
        const ch=text[i-1];
        setTimeout(type, text[i]==='.'?380 : ch===' '?220 : 110+Math.random()*70);
      }else{
        setTimeout(()=>el.closest('.tw').classList.add('finished'),900);
      }
    }
    setTimeout(type,1300);
  })();

  // gentle parallax on the glows
  (function(){
    const a=document.getElementById('aurora');
    function move(x,y){a.style.transform='translate('+(x*-30)+'px,'+(y*-30)+'px)';}
    addEventListener('pointermove',e=>move(e.clientX/innerWidth-.5,e.clientY/innerHeight-.5));
  })();

  // twinkling, rising sparkles
  (function(){
    if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    const c=document.getElementById('sparkles'),ctx=c.getContext('2d');
    let W,H,dpr,parts=[];
    function size(){dpr=Math.min(devicePixelRatio||1,2);W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;}
    size();addEventListener('resize',size);
    const N=Math.round(Math.min(22,innerWidth/50));
    const tints=['255,255,255'];
    function make(initial){
      return{x:Math.random()*W,y:initial?Math.random()*H:H+20*dpr,
        r:(Math.random()*1.2+0.5)*dpr,vy:(Math.random()*0.12+0.05)*dpr,
        sway:Math.random()*Math.PI*2,swaySpeed:Math.random()*0.01+0.004,
        tw:Math.random()*Math.PI*2,twSpeed:Math.random()*0.015+0.006,
        star:Math.random()<0.15,tint:tints[(Math.random()*tints.length)|0]};
    }
    for(let i=0;i<N;i++)parts.push(make(true));
    function drawStar(x,y,r,a,t){
      ctx.fillStyle='rgba('+t+','+a+')';ctx.beginPath();
      const R=r*3.2;ctx.moveTo(x,y-R);ctx.quadraticCurveTo(x,y,x+R,y);ctx.quadraticCurveTo(x,y,x,y+R);
      ctx.quadraticCurveTo(x,y,x-R,y);ctx.quadraticCurveTo(x,y,x,y-R);ctx.fill();
    }
    function tick(){
      ctx.clearRect(0,0,W,H);
      for(const p of parts){
        p.y-=p.vy;p.sway+=p.swaySpeed;p.tw+=p.twSpeed;
        const x=p.x+Math.sin(p.sway)*12*dpr;
        const a=0.12+0.4*(0.5+0.5*Math.sin(p.tw));
        if(p.star){drawStar(x,p.y,p.r,a,p.tint);}
        else{
          const g=ctx.createRadialGradient(x,p.y,0,x,p.y,p.r*3);
          g.addColorStop(0,'rgba('+p.tint+','+a+')');g.addColorStop(1,'rgba('+p.tint+',0)');
          ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,p.y,p.r*3,0,Math.PI*2);ctx.fill();
        }
        if(p.y<-30*dpr)Object.assign(p,make(false));
      }
      requestAnimationFrame(tick);
    }
    tick();
  })();
</script>
</body>
</html>
